<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" role="img" aria-labelledby="title desc">
  <title id="title">Tsuki Journeys destination map</title>
  <desc id="desc">A Pacific-centered world map with accurate route locations from Tokyo to Kyoto, Dubai, Singapore, and Paris, a gateway for the Europe journey.</desc>
  <image href="world-map.svg" x="0" y="0" width="1000" height="500" />
  <g fill="none" stroke="#e6cba4" stroke-width="2.4" stroke-linecap="round" opacity=".95">
    <path d="M444 151 Q437 152 431 154" />
    <path d="M444 151 Q335 109 209 180" />
    <path d="M444 151 Q382 183 344 246" />
    <path d="M444 151 Q263 1 63 114" />
  </g>
  <g fill="#f4d9ae" stroke="#18353d" stroke-width="3">
    <circle cx="444" cy="151" r="6" />
    <circle cx="431" cy="154" r="4" />
    <circle cx="209" cy="180" r="4" />
    <circle cx="344" cy="246" r="4" />
    <circle cx="63" cy="114" r="4" />
  </g>
  <g fill="#f4eee2" stroke="#102b35" stroke-width="5" paint-order="stroke" font-family="Arial, sans-serif" font-size="19" font-weight="700" letter-spacing="1.3">
    <text x="456" y="143">TOKYO · HND</text>
    <text x="440" y="172" font-size="16">KYOTO · KIX</text>
    <text x="221" y="185">DUBAI</text>
    <text x="356" y="252">SINGAPORE</text>
    <text x="75" y="109">PARIS · EUROPE</text>
  </g>
</svg>
